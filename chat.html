<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chat</title>
</head>
<body>
	<ul class="pages">
		<li class="login page">
			<div class="form">
				<h3 class="title">What's your nickname?</h3>
				<input class="usernameInput" type="text" maxlength="14">
			</div>
		</li>
	</ul>

	<script>
		const usernameInput = document.querySelector('.usernameInput');
		usernameInput.focus();

		document.addEventListener('keydown', (event) => {
			const username = usernameInput.value.trim();
			if (event.key !== 'Enter' || !username || document.querySelector('.chat.page')) {
				return;
			}

			document.querySelector('.login.page').remove();
			document.querySelector('.pages').insertAdjacentHTML('beforeend', `
				<li class="chat page">
					<div class="chatArea">
						<ul class="messages">
							<li class="log">Welcome, ${username.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)}</li>
						</ul>
					</div>
					<input class="inputMessage" placeholder="Type here...">
				</li>
			`);
			document.querySelector('.inputMessage').focus();
		});
	</script>
</body>
</html>
